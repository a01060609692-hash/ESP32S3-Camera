name: Build ESP32-S3 OV5640 Camera Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Compile ESP32-S3 program
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

          mkdir -p CamPhone
          cp CamPhone.ino CamPhone/CamPhone.ino

          arduino-cli compile \
            --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB,FlashMode=dio' \
            --output-dir build \
            CamPhone

      - name: Make combined BIN file
        run: |
          python -m pip install 'esptool>=5,<6'
          python -m esptool --chip esp32s3 merge-bin \
            -o build/OV5640_S3_N16R8_FACTORY.bin \
            --flash-mode dio --flash-size 16MB --flash-freq 40m \
            0x0 build/CamPhone.ino.bootloader.bin \
            0x8000 build/CamPhone.ino.partitions.bin \
            0x10000 build/CamPhone.ino.bin

      - name: Publish firmware download
        uses: actions/upload-artifact@v4
        with:
          name: ESP32S3-OV5640-camera-firmware-DIO
          path: build/OV5640_S3_N16R8_FACTORY.bin
          if-no-files-found: error
